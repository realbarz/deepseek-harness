        transport: stdio
        command: npx
        args: ['-y', '@modelcontextprotocol/server-qdrant']
        env:
          QDRANT_URL: !!js process.env.QDRANT_URL || 'http://localhost:6333'
          QDRANT_API_KEY: !!js process.env.QDRANT_API_KEY || ""
        failOnStartupError: false

