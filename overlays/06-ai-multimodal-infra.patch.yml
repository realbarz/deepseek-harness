# Domain VI: AI Infrastructure, Multimodal Perception & Knowledge Graphs
# DeepSeek Harness Cordis Profile Overlay
# Launch: pnpm dsh web --patch overlays/06-ai-multimodal-infra.patch.yml

- insert:
    - id: mcp-brave-search
      name: '@deepseek-ai/dsh-mcp-client'
      disabled: !!js '!process.env.BRAVE_API_KEY'
      config:
        serverName: brave_search
        transport: stdio
        command: npx
        args: ['-y', '@modelcontextprotocol/server-brave-search']
        env:
          BRAVE_API_KEY: !!js process.env.BRAVE_API_KEY || ""
        failOnStartupError: false

    - id: mcp-pinecone-vector
      name: '@deepseek-ai/dsh-mcp-client'
      disabled: !!js '!process.env.PINECONE_API_KEY'
      config:
