# Domain III: Financial Autonomy & Wealth Management
# DeepSeek Harness Cordis Profile Overlay
# Launch: pnpm dsh web --patch overlays/03-financial-autonomy.patch.yml

- insert:
    - id: mcp-crypto-portfolio
      name: '@deepseek-ai/dsh-mcp-client'
      disabled: !!js '!process.env.COINBASE_API_KEY'
      config:
        serverName: crypto
        transport: stdio
        command: npx
        args: ['-y', '@modelcontextprotocol/server-coinbase']
        env:
          COINBASE_API_KEY: !!js process.env.COINBASE_API_KEY || ""
          COINBASE_API_SECRET: !!js process.env.COINBASE_API_SECRET || ""
        failOnStartupError: false

    - id: mcp-stock-alpaca
      name: '@deepseek-ai/dsh-mcp-client'
      disabled: !!js '!process.env.ALPACA_API_KEY_ID'
      config:
        serverName: equities
        transport: stdio
        command: npx
        args: ['-y', '@modelcontextprotocol/server-alpaca']
        env:
          ALPACA_API_KEY_ID: !!js process.env.ALPACA_API_KEY_ID || ""
          ALPACA_SECRET_KEY: !!js process.env.ALPACA_SECRET_KEY || ""
        failOnStartupError: false

