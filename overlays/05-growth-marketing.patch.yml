# Domain V: Growth Marketing, Social Automation & Client Relations
# DeepSeek Harness Cordis Profile Overlay
# Launch: pnpm dsh web --patch overlays/05-growth-marketing.patch.yml

- insert:
    - id: mcp-buffer-social
      name: '@deepseek-ai/dsh-mcp-client'
      disabled: !!js '!process.env.BUFFER_ACCESS_TOKEN'
      config:
        serverName: buffer
        transport: stdio
        command: npx
        args: ['-y', '@modelcontextprotocol/server-buffer']
        env:
          BUFFER_ACCESS_TOKEN: !!js process.env.BUFFER_ACCESS_TOKEN || ""
        failOnStartupError: false

