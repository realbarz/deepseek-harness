# Domain IV: Enterprise Operations, Cloud Infrastructure & DevOps
# DeepSeek Harness Cordis Profile Overlay
# Launch: pnpm dsh web --patch overlays/04-enterprise-devops.patch.yml

- insert:
    - id: mcp-github-org
      name: '@deepseek-ai/dsh-mcp-client'
      disabled: !!js '!(process.env.GITHUB_TOKEN || process.env.GH_TOKEN)'
      config:
        serverName: github
        transport: stdio
        command: npx
        args: ['-y', '@modelcontextprotocol/server-github']
        env:
          GITHUB_PERSONAL_ACCESS_TOKEN: !!js process.env.GITHUB_TOKEN || process.env.GH_TOKEN || ""
        failOnStartupError: false

    - id: mcp-gitlab-ci
      name: '@deepseek-ai/dsh-mcp-client'
