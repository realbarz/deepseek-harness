# Domain II: E-Commerce, Arbitrage, Resale & Monetization Operations
# DeepSeek Harness Cordis Profile Overlay
# Launch: pnpm dsh web --patch overlays/02-ecommerce-arbitrage.patch.yml

- insert:
    - id: mcp-ebay-arbitrage
      name: '@deepseek-ai/dsh-mcp-client'
      disabled: !!js '!process.env.EBAY_APP_ID'
      config:
        serverName: ebay
        transport: stdio
        command: npx
        args: ['-y', '@modelcontextprotocol/server-ebay']
        env:
          EBAY_APP_ID: !!js process.env.EBAY_APP_ID || ""
          EBAY_CERT_ID: !!js process.env.EBAY_CERT_ID || ""
        failOnStartupError: false

    - id: mcp-amazon-sp-api
      name: '@deepseek-ai/dsh-mcp-client'
      disabled: !!js '!process.env.AMAZON_REFRESH_TOKEN'
      config:
        serverName: amazon_sp
        transport: stdio
        command: npx
        args: ['-y', '@modelcontextprotocol/server-amazon-sp']
        env:
          AMAZON_REFRESH_TOKEN: !!js process.env.AMAZON_REFRESH_TOKEN || ""
        failOnStartupError: false

