# Domain I: Central Life Management & Personal Operations
# DeepSeek Harness Cordis Profile Overlay
# Launch: pnpm dsh web --patch overlays/01-life-management.patch.yml

- insert:
    - id: mcp-google-calendar
      name: '@deepseek-ai/dsh-mcp-client'
      disabled: true
      config:
        serverName: calendar
        transport: stdio
        command: npx
        args: ['-y', '@modelcontextprotocol/server-google-calendar']
        failOnStartupError: false

    - id: mcp-apple-health
      name: '@deepseek-ai/dsh-mcp-client'
      disabled: true
      config:
        serverName: health
        transport: stdio
        command: npx
        args: ['-y', '@modelcontextprotocol/server-apple-health']
        failOnStartupError: false

    - id: mcp-plaid-finance
      name: '@deepseek-ai/dsh-mcp-client'
      disabled: !!js '!process.env.PLAID_CLIENT_ID'
      config:
        serverName: finance
        transport: stdio
        command: npx
        args: ['-y', '@modelcontextprotocol/server-plaid']
        env:
          PLAID_CLIENT_ID: !!js process.env.PLAID_CLIENT_ID || ""
          PLAID_SECRET: !!js process.env.PLAID_SECRET || ""
        failOnStartupError: false

    - id: mcp-obsidian-notes
      name: '@deepseek-ai/dsh-mcp-client'
      disabled: !!js '!process.env.OBSIDIAN_VAULT_PATH'
      config:
        serverName: notes
        transport: stdio
        command: npx
        args: ['-y', '@modelcontextprotocol/server-obsidian']
        env:
          OBSIDIAN_VAULT_PATH: !!js process.env.OBSIDIAN_VAULT_PATH || process.cwd()
        failOnStartupError: false

    - id: mcp-home-assistant
      name: '@deepseek-ai/dsh-mcp-client'
      disabled: !!js '!process.env.HASS_TOKEN'
      config:
        serverName: home_assistant
        transport: stdio
        command: npx
        args: ['-y', '@modelcontextprotocol/server-home-assistant']
        env:
          HASS_TOKEN: !!js process.env.HASS_TOKEN || ""
          HASS_HOST: !!js process.env.HASS_HOST || 'http://localhost:8123'
        failOnStartupError: false

    - id: mcp-telegram-comms
