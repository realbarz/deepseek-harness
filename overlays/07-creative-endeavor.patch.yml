# Domain VII: Creative Endeavors, Generative Media & Artistic Production
# DeepSeek Harness Cordis Profile Overlay
# Launch: pnpm dsh web --patch overlays/07-creative-endeavor.patch.yml

- insert:
    - id: mcp-ableton-midi
      name: '@deepseek-ai/dsh-mcp-client'
      disabled: true
      config:
        serverName: ableton_midi
        transport: stdio
        command: npx
        args: ['-y', '@modelcontextprotocol/server-midi']
        failOnStartupError: false

    - id: mcp-blender-python
      name: '@deepseek-ai/dsh-mcp-client'
      disabled: true
      config:
        serverName: blender_3d
        transport: stdio
        command: npx
        args: ['-y', '@modelcontextprotocol/server-blender']
        failOnStartupError: false

    - id: mcp-figma-design
      name: '@deepseek-ai/dsh-mcp-client'
      disabled: !!js '!process.env.FIGMA_ACCESS_TOKEN'
      config:
        serverName: figma
        transport: stdio
        command: npx
        args: ['-y', '@modelcontextprotocol/server-figma']
        env:
          FIGMA_ACCESS_TOKEN: !!js process.env.FIGMA_ACCESS_TOKEN || ""
        failOnStartupError: false

